services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nemori
      POSTGRES_PASSWORD: nemori
      POSTGRES_DB: nemori
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nemori_pg_data:/var/lib/postgresql/data
      - ./docker/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nemori"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - nemori_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo -n > /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 5

  phoenix:
    image: arizephoenix/phoenix:18.1.0
    ports:
      - "127.0.0.1:6006:6006"
      - "127.0.0.1:4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_TELEMETRY_ENABLED: "false"
    volumes:
      - nemori_phoenix_data:/mnt/data
    healthcheck:
      test:
        - CMD
        - /usr/bin/python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  nemori_pg_data:
  nemori_qdrant_data:
  nemori_phoenix_data:
